# Single-VPS deployment (docs/07 section 1). Values come from .env — see .env.example.
# Start order is enforced with service_healthy/service_completed_successfully,
# never with sleeps:
#   postgres/redis healthy -> migrate (runs to completion) -> web + worker -> caddy.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mysp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysp}
      POSTGRES_DB: ${POSTGRES_DB:-mysp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mysp} -d ${POSTGRES_DB:-mysp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: queued jobs must survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot schema migration. Runs to completion BEFORE web/worker start.
  # Why a dependency and not a `setup` profile: with
  # `service_completed_successfully` the ordering is enforced by `docker compose
  # up` itself, so no operator can forget the manual step and no app container
  # ever boots against an un-migrated database. drizzle-kit migrate is
  # idempotent, so re-running it on every `up` is a no-op.
  # It also carries tsx + src, so `docker compose run --rm migrate pnpm db:seed`
  # is the way to seed without a second image.
  migrate:
    build:
      context: .
      target: migrate
    # A finished one-shot must stay finished; restarting it would loop forever.
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysp}:${POSTGRES_PASSWORD:-mysp}@postgres:5432/${POSTGRES_DB:-mysp}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "false"
      # Service names, not localhost: containers talk over the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysp}:${POSTGRES_PASSWORD:-mysp}@postgres:5432/${POSTGRES_DB:-mysp}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-example.com}
      # Never derive the browser-visible origin from Docker's 0.0.0.0 bind.
      # Local default follows WEB_PORT; production must set its HTTPS origin.
      AUTH_URL: ${AUTH_URL:-http://localhost:${WEB_PORT:-3000}}
      SESSION_SECRET: ${SESSION_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      # E9 mode B. A named volume, not a bind: the bytes must outlive a
      # container rebuild, because a post referencing them can be scheduled for
      # tomorrow. Same path in web and worker — one writes, the other sweeps.
      UPLOAD_STORAGE_ROOT: /var/lib/mysp/uploads
      UPLOAD_ORPHAN_TTL_HOURS: ${UPLOAD_ORPHAN_TTL_HOURS:-24}
      # E5.1 login product. The redirect URI must ALSO be listed in the Meta app
      # (Facebook Login -> Valid OAuth Redirect URIs) or the dialog refuses it.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      # Opens the Page tokens sealed inside tenant_integration.config. Missing it
      # fails every channel read with CHANNEL_NOT_CONFIGURED, and CHANGING it
      # makes the stored tokens unreadable for good — re-connect the channels
      # first. Read on demand, so a process touching no token still boots.
      TENANT_SECRETS_ENC_KEY: ${TENANT_SECRETS_ENC_KEY:-}
      # Facebook fetches every photo from this origin, so it must be the PUBLIC
      # https host (the Caddy hostname) — localhost is unreachable for Meta.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      # E4 caption generation. One provider today (ADR-001 / provider-strategy
      # section 3.1); the model chain lives in config/ai-models.yaml.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Drive/Sheet sync. The key file is mounted read-only below rather than
      # inlined as JSON: a multi-line private key inside .env breaks easily.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    secrets:
      - google_service_account
    expose:
      - "3000"
    ports:
      # Direct access for debugging; Caddy is the normal entry point.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Local UI-only demo. It deliberately runs `next dev`, rather than the
  # production image, so DEV_FAKE_SESSION can be used without weakening prod.
  # Start explicitly: docker compose --profile demo up -d web-demo
  # Browse: http://localhost:3001
  web-demo:
    profiles: ["demo"]
    build:
      context: .
      target: deps
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysp}:${POSTGRES_PASSWORD:-mysp}@postgres:5432/${POSTGRES_DB:-mysp}
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://localhost:${DEMO_WEB_PORT:-3001}
      DEV_FAKE_SESSION: "1"
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./:/app
      - webdemo_node_modules:/app/node_modules
      - uploaddata:/var/lib/mysp/uploads
    ports:
      - "${DEMO_WEB_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: "false"
      # The worker runs the same usecases as the web process, so it needs the DB.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mysp}:${POSTGRES_PASSWORD:-mysp}@postgres:5432/${POSTGRES_DB:-mysp}
      REDIS_URL: redis://redis:6379
      # Graph API version used by the publish jobs (E5). Bumping it is a deploy
      # decision; Page ids and tokens live in tenant_integration, not here.
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HEARTBEAT_FILE: /tmp/mysp-worker-heartbeat
      WORKER_SHUTDOWN_DEADLINE_MS: ${WORKER_SHUTDOWN_DEADLINE_MS:-30000}
      # E9.4 — the cleanup sweep deletes the bytes, so it needs the same volume
      # mounted at the same path as the web process.
      UPLOAD_STORAGE_ROOT: /var/lib/mysp/uploads
      UPLOAD_ORPHAN_TTL_HOURS: ${UPLOAD_ORPHAN_TTL_HOURS:-24}
      # The publish job opens the sealed Page token before every call to Graph,
      # so the worker needs the SAME key as web. Without it a scheduled post
      # fails at its due time with CHANNEL_NOT_CONFIGURED and nothing publishes.
      TENANT_SECRETS_ENC_KEY: ${TENANT_SECRETS_ENC_KEY:-}
      # The worker signs the photo URLs it hands to Facebook, so both values must
      # match web's — a signature made with another secret is rejected on fetch.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      # Wired lazily (makeLazyGenerateCaptions / makeLazyGoogleSources): today's
      # jobs never reach them, but a job that does must not die on a missing key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    volumes:
      - uploaddata:/var/lib/mysp/uploads
    secrets:
      - google_service_account
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # E11.4 — periodic pg_dump into the `backupdata` volume.
  # Image matches the server (postgres:16-alpine): pg_dump refuses a server newer
  # than itself, so these two versions must move together.
  # Restore instructions live in deploy/backup/backup.sh (read them BEFORE the
  # day you need them). One-off dump:
  #   docker compose run --rm -e BACKUP_RUN_ONCE=true pg-backup
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-mysp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mysp}
      PGDATABASE: ${POSTGRES_DB:-mysp}
      BACKUP_DIR: /backups
      # Daily by default; keep a week of dumps.
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backupdata:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host 8080 on purpose: never squat on the developer's 80/443.
      # On the VPS use "80:80" and "443:443" together with a real hostname
      # in deploy/caddy/Caddyfile.
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    # Caddy's admin API (localhost:2019, on by default) answers only while the
    # config is loaded — a good liveness signal, and it needs no extra tool:
    # wget ships with the alpine image.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

# The Google Service Account key, handed to web and worker as a file at
# /run/secrets/google_service_account (read-only, never in an env var: the
# private key is multi-line and a stray newline in .env breaks it silently).
# A compose `secret` rather than a bind mount on purpose — a bind whose source
# is missing makes Docker create an empty DIRECTORY at that path, and the error
# only surfaces later, during a sync. This form refuses to start instead.
# Point GOOGLE_SA_FILE at the key file; keep it out of git (/secrets/).
secrets:
  google_service_account:
    file: ${GOOGLE_SA_FILE:-./secrets/mysp-service-account.json}

volumes:
  pgdata:
  # Dumps live in their own volume: a `docker compose down -v` of the app data
  # must not be the same gesture that deletes the backups.
  backupdata:
  redisdata:
  caddydata:
  caddyconfig:
  webdemo_node_modules:
  # E9 — operator-uploaded media. Shared by web (writes) and worker (sweeps).
  # Its own volume so `docker compose down -v` of the app data is a deliberate
  # decision about the operator's files, not a side effect.
  uploaddata:
