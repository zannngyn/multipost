# LOCAL DEVELOPMENT ONLY. Docker Compose loads this file automatically whenever
# you run a bare `docker compose ...` from the repo root, and never loads it in
# production, where the deploy names its files explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
#
# WHY IT EXISTS: on the VPS the app talks to the SHARED MinIO in /srv/minio
# (`minio-server`, reached over the external `data` network) with a service
# account scoped to its own buckets. A dev machine has no such thing, so this
# file adds a MinIO of its own — plus the bucket bootstrap that makes it
# private, and the Caddy that used to front the stack locally.
#
# WHY NOT A PROFILE: `profiles:` cannot be used for this. A service excluded by
# a profile is not merely skipped — it stops existing, and the depends_on in
# docker-compose.yml pointing at it makes the whole project invalid:
#   service "web" depends on undefined service "minio"
# An override file, on the other hand, can ADD both the service and the
# depends_on entry. That is the only shape that works in both worlds.

services:
  # E9 (MinIO upload) — object storage for operator-uploaded bytes (mode B).
  # Reached over MINIO_INTERNAL_ENDPOINT, which defaults to `minio:9000` — the
  # name of this service — so nothing has to be set locally.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # `:?` is load-bearing, not decoration: an EMPTY value (not just an
      # unset one) makes MinIO silently fall back to minioadmin:minioadmin.
      # `:-` or a bare ${...} would let that happen quietly on a published
      # port — `:?` aborts the whole `up` instead. Locked by
      # minio-bucket-privacy.test.ts.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - miniodata:/data
    ports:
      # LOOPBACK ONLY, never 0.0.0.0 — same discipline as WEB_BIND. The bucket
      # itself is private, but the API (and the admin console on 9001) still
      # must not sit on a public interface.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap. `mc anonymous set none` is what keeps the bucket
  # PRIVATE — every tenant's photos are reachable ONLY through a presigned URL
  # after this runs. Do not drop that line: without it the bucket defaults to
  # readable by anyone who guesses (or is handed) an object key.
  #
  # Production has no equivalent step and does not need one: /srv/_infra/
  # new-app-s3.sh creates `<app>-private` with no anonymous policy at all, and
  # the app's service account cannot change that.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
             mc mb -p local/$$MINIO_BUCKET &&
             mc anonymous set none local/$$MINIO_BUCKET"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-mysp-media}

  # The fail-closed ordering, added back here because the services it protects
  # live in the base file: wait for minio-init to FINISH, not just for minio to
  # answer its healthcheck, or a container can start serving uploads into a
  # bucket that has not been made private yet.
  web:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web-demo:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # App-level router for local work. Production does NOT use it: the VPS is
  # fronted by Cloudflare Tunnel -> Traefik (/srv/_infra), and a second reverse
  # proxy behind that one is duplicated work.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host 8080 on purpose: never squat on the developer's 80/443.
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    # Caddy's admin API (localhost:2019, on by default) answers only while the
    # config is loaded — a good liveness signal, and it needs no extra tool:
    # wget ships with the alpine image.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

volumes:
  # E9 (MinIO upload) — dev-only object storage. The production stack keeps its
  # bytes in the shared MinIO's own volume, not here.
  miniodata:
  caddydata:
  caddyconfig:
