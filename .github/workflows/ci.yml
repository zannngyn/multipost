# Pull-request gate.
#
# Note what is absent: `push` on `dev`. Day-to-day work merges into dev without
# spending a single Actions minute, by request. The first time a change is
# checked is when it is proposed for `main` — i.e. when it is about to become a
# deployment.
name: CI

on:
  pull_request:
    branches: [main]
  # Lets a branch be checked without opening a pull request first.
  workflow_dispatch:

# A new push to the same PR makes the previous run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
