# Production/staging overlay. Always used together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
#
# What it changes: web/worker/migrate run PRE-BUILT images from GHCR instead of
# building on the VPS. Building on the box that also runs production means a
# deploy can OOM the thing it is deploying.
#
# Two stacks share this VPS (staging + production). They stay apart through
# COMPOSE_PROJECT_NAME, which namespaces containers AND volumes — separate
# database, separate Redis, separate uploads. Set it in the stack's .env.
#
# HTTPS is NOT in here. The VPS already runs Caddy under systemd (it serves
# other sites), and two processes cannot share :443. So each stack publishes its
# web port on LOOPBACK ONLY — WEB_BIND=127.0.0.1 in the stack's .env — and the
# host Caddy reverse-proxies to it. The site blocks live in
# deploy/edge/mysp.caddy; the per-stack `caddy` service from the base file is
# left unstarted (`--scale caddy=0`).

services:
  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always

  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/web:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always

  worker:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/worker:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
